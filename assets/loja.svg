<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bagGrad" x1="10" y1="14" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="capySnoutGrad" x1="16" y1="24" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="noseMuzzleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <filter id="bagGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284C7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#bagGlow)">
    <!-- Bag Handles -->
    <path d="M18 16V12C18 8.686 20.686 6 24 6C27.314 6 30 8.686 30 12V16"
          stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" />

    <!-- Shopping Bag Body -->
    <path d="M10 16H38L35.5 42C35.3 43.1 34.3 44 33.2 44H14.8C13.7 44 12.7 43.1 12.5 42L10 16Z"
          fill="url(#bagGrad)" />

    <!-- Subtle Bag Fold/Lip Highlight -->
    <path d="M10 16L13 20H35L38 16" fill="#FFFFFF" opacity="0.18" />

    <!-- Capybara Face / Muzzle Graphic on the Bag -->
    <!-- Capybara Head Base on Bag -->
    <rect x="15" y="21" width="18" height="18" rx="7" fill="url(#capySnoutGrad)" />

    <!-- Cute Capy Ears -->
    <circle cx="15.5" cy="21.5" r="2.5" fill="#B45309" />
    <circle cx="15.5" cy="21.5" r="1.2" fill="#FDE68A" />
    <circle cx="32.5" cy="21.5" r="2.5" fill="#B45309" />
    <circle cx="32.5" cy="21.5" r="1.2" fill="#FDE68A" />

    <!-- Happy Eyes -->
    <path d="M18 26C19 25 20.5 25 21.5 26" stroke="#451A03" stroke-width="1.8" stroke-linecap="round" />
    <path d="M26.5 26C27.5 25 29 25 30 26" stroke="#451A03" stroke-width="1.8" stroke-linecap="round" />

    <!-- Big Cute Snout (Focinho) -->
    <ellipse cx="24" cy="32.5" rx="5.2" ry="4.2" fill="url(#noseMuzzleGrad)" />
    <!-- Nostrils -->
    <circle cx="22" cy="31.8" r="0.9" fill="#FEF3C7" opacity="0.9" />
    <circle cx="26" cy="31.8" r="0.9" fill="#FEF3C7" opacity="0.9" />
    <!-- Smile Under Snout -->
    <path d="M22 34C23 35 25 35 26 34" stroke="#FEF3C7" stroke-width="0.9" stroke-linecap="round" />

    <!-- Soft Cheeks -->
    <circle cx="16.5" cy="30.5" r="1.4" fill="#F87171" opacity="0.6" />
    <circle cx="31.5" cy="30.5" r="1.4" fill="#F87171" opacity="0.6" />
  </g>
</svg>
