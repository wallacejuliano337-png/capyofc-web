<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="targetOuterGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="targetInnerGrad" x1="14" y1="14" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <filter id="targetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#targetGlow)">
    <!-- Outer Target Ring -->
    <circle cx="24" cy="24" r="19" stroke="url(#targetOuterGrad)" stroke-width="3" />

    <!-- Crosshair Target Ticks -->
    <line x1="24" y1="2" x2="24" y2="7" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="41" x2="24" y2="46" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="2" y1="24" x2="7" y2="24" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />
    <line x1="41" y1="24" x2="46" y2="24" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" />

    <!-- Middle Ring -->
    <circle cx="24" cy="24" r="14" fill="#064E3B" fill-opacity="0.25" stroke="#6EE7B7" stroke-width="2" stroke-dasharray="3 2" />

    <!-- Center Bullseye Circle -->
    <circle cx="24" cy="24" r="10.5" fill="url(#targetInnerGrad)" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Capybara Paw Print (Patinha) in Bullseye -->
    <!-- Main Palm Pad -->
    <path d="M21.5 24.5C21.5 22.8 23 21.8 24 21.8C25 21.8 26.5 22.8 26.5 24.5C26.5 26.5 25.5 28 24 28C22.5 28 21.5 26.5 21.5 24.5Z"
          fill="#FFFFFF" />

    <!-- Toe Beans / Dedinhos da Patinha -->
    <!-- Leftmost Toe -->
    <ellipse cx="19.2" cy="21.5" rx="1.3" ry="1.9" transform="rotate(-25 19.2 21.5)" fill="#FFFFFF" />
    <!-- Center-Left Toe -->
    <ellipse cx="22.2" cy="19" rx="1.4" ry="2" transform="rotate(-8 22.2 19)" fill="#FFFFFF" />
    <!-- Center-Right Toe -->
    <ellipse cx="25.8" cy="19" rx="1.4" ry="2" transform="rotate(8 25.8 19)" fill="#FFFFFF" />
    <!-- Rightmost Toe -->
    <ellipse cx="28.8" cy="21.5" rx="1.3" ry="1.9" transform="rotate(25 28.8 21.5)" fill="#FFFFFF" />
  </g>
</svg>
