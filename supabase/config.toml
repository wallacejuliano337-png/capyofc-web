[functions.livekit-token]
# O handler exige Bearer e valida auth.getUser(); identidade não vem do cliente.
# A verificação legada do gateway não substitui esta autenticação.
verify_jwt = false

[auth]
additional_redirect_urls = []
site_url = "https://tfjkinffnksmiqatdhnb.supabase.co"

[auth.email]
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
