<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="capy1Grad" x1="8" y1="12" x2="26" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="capy2Grad" x1="22" y1="10" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#E27500" />
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <filter id="glowHeart" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#EC4899" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Left Capybara -->
  <g id="capy-left">
    <!-- Ear -->
    <path d="M12 16C10 16 9 18 10 20C11 22 13 22 14 20C15 18 14 16 12 16Z" fill="#B45309" />
    <!-- Head / Body -->
    <rect x="9" y="17" width="18" height="21" rx="8" fill="url(#capy1Grad)" />
    <!-- Cheeks / Snout outline -->
    <path d="M7 26C7 22.5 10 20 15 20H18C23 20 25 22.5 25 26V32C25 35 22 37 17 37C12 37 7 35 7 32V26Z" fill="url(#capy1Grad)" />
    <!-- Nose / Snout -->
    <ellipse cx="14" cy="29" rx="4.5" ry="3.5" fill="url(#snoutGrad)" />
    <circle cx="12.5" cy="28.5" r="0.75" fill="#FEF3C7" opacity="0.8" />
    <circle cx="15.5" cy="28.5" r="0.75" fill="#FEF3C7" opacity="0.8" />
    <!-- Eye (Happy squint) -->
    <path d="M18 23C19 22 20.5 22 21.5 23" stroke="#451A03" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Right Capybara (tilted slightly, overlapping) -->
  <g id="capy-right">
    <!-- Ear -->
    <path d="M37 15C39 15 40 17 39 19C38 21 36 21 35 19C34 17 35 15 37 15Z" fill="#B45309" />
    <!-- Head / Body -->
    <rect x="22" y="16" width="18" height="22" rx="8" fill="url(#capy2Grad)" />
    <!-- Snout & Face -->
    <path d="M24 25C24 21.5 27 19 32 19H34C39 19 42 21.5 42 25V31C42 34.5 39 37 34 37C29 37 24 34.5 24 31V25Z" fill="url(#capy2Grad)" />
    <!-- Nose / Snout -->
    <ellipse cx="34.5" cy="28" rx="4.8" ry="3.8" fill="url(#snoutGrad)" />
    <circle cx="33" cy="27.5" r="0.8" fill="#FEF3C7" opacity="0.8" />
    <circle cx="36" cy="27.5" r="0.8" fill="#FEF3C7" opacity="0.8" />
    <!-- Eye (Happy squint) -->
    <path d="M26.5 22C27.5 21 29 21 30 22" stroke="#451A03" stroke-width="1.8" stroke-linecap="round" />
    <!-- Blush -->
    <circle cx="40" cy="28" r="1.5" fill="#F87171" opacity="0.5" />
  </g>

  <!-- Little Heart Floating Above Between Them -->
  <path d="M24 12.5C24 12.5 22.5 10 20.8 10C19.2 10 18 11.2 18 12.8C18 15 21 17.2 24 19.5C27 17.2 30 15 30 12.8C30 11.2 28.8 10 27.2 10C25.5 10 24 12.5 24 12.5Z"
        fill="#EC4899" filter="url(#glowHeart)" />
</svg>