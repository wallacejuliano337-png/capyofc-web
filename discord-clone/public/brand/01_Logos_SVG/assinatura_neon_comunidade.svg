<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Inter:wght@500&amp;display=swap');
      .hand-title { fill: #8B5CF6; font-family: 'Caveat', cursive, sans-serif; font-weight: 700; font-size: 46px; filter: url(#glow); }
      .hand-sub { fill: #A78BFA; font-family: 'Caveat', cursive, sans-serif; font-weight: 700; font-size: 26px; }
    </style>
  </defs>
  <rect width="320" height="180" rx="16" fill="#0F0F14"/>
  <text x="160" y="65" text-anchor="middle" transform="rotate(-6 160 65)" class="hand-title">CapyChat</text>
  <!-- Coroa Neon -->
  <path d="M 215,95 L 215,78 L 223,86 L 230,74 L 237,86 L 245,78 L 245,95 Z" fill="none" stroke="#A78BFA" stroke-width="2.5" filter="url(#glow)" transform="rotate(-5 230 85)"/>
  <text x="160" y="130" text-anchor="middle" class="hand-sub">Mais que um app.</text>
  <text x="160" y="158" text-anchor="middle" class="hand-sub">Uma comunidade.</text>
</svg>