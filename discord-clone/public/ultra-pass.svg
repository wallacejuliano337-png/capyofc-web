<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="crownGrad" x1="6" y1="12" x2="42" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF77E9" />
      <stop offset="45%" stop-color="#B055FF" />
      <stop offset="100%" stop-color="#5865F2" />
    </linearGradient>
    <linearGradient id="goldGemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="facetHighlight" x1="24" y1="12" x2="24" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#C084FC" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#crownGlow)">
    <!-- Base Crown Shape -->
    <path d="M7 36L11 18L18 25L24 12L30 25L37 18L41 36H7Z"
          fill="url(#crownGrad)" />

    <!-- Crown Facets for 3D depth -->
    <!-- Center Peak Facets -->
    <path d="M24 12L18 25L24 36L30 25L24 12Z"
          fill="url(#facetHighlight)" opacity="0.35" />
    <path d="M24 12L30 25L24 36V12Z"
          fill="#000000" opacity="0.15" />

    <!-- Left Wing Facet -->
    <path d="M11 18L18 25L14 36L7 36L11 18Z"
          fill="#FFFFFF" opacity="0.12" />

    <!-- Right Wing Facet -->
    <path d="M37 18L30 25L34 36L41 36L37 18Z"
          fill="#000000" opacity="0.2" />

    <!-- Bottom Crown Band -->
    <rect x="7" y="34" width="34" height="4" rx="2" fill="url(#crownGrad)" />
    <rect x="8" y="34.5" width="32" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.4" />

    <!-- Jewels / Gems on Peaks -->
    <circle cx="11" cy="17" r="2.2" fill="url(#goldGemGrad)" stroke="#FFFFFF" stroke-width="0.75" />
    <circle cx="24" cy="11.5" r="3" fill="url(#goldGemGrad)" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="37" cy="17" r="2.2" fill="url(#goldGemGrad)" stroke="#FFFFFF" stroke-width="0.75" />

    <!-- Center Emblem Gem -->
    <polygon points="24,24 27.5,28.5 24,33 20.5,28.5" fill="url(#goldGemGrad)" stroke="#FFFFFF" stroke-width="0.8" />

    <!-- Sparkle on Central Gem -->
    <path d="M24 26V31M21.5 28.5H26.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
